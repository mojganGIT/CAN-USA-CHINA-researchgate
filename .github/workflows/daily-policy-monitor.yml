name: Daily Policy Monitor
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['monitor/**', 'app/evidence-records.json', '.github/workflows/daily-policy-monitor.yml']
permissions:
  contents: write
concurrency:
  group: daily-policy-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate monitor and customer LLM boundaries
        run: |
          node scripts/validate-evidence.mjs
          npm test
      - name: Refresh official provincial trade series
        run: node monitor/refresh-regional-stats.mjs
      - name: Refresh U.S. goods trade with Canada and China
        run: node monitor/refresh-us-trade.mjs
      - name: Refresh official BEA investment tables
        run: python3 monitor/discover-us-investment.py
      - name: Observe official sources and extract supported policy changes
        id: scan
        continue-on-error: true
        env:
          POLICY_MONITOR_API_KEY: ${{ secrets.POLICY_MONITOR_API_KEY }}
          POLICY_MONITOR_MODEL: ${{ vars.POLICY_MONITOR_MODEL }}
          POLICY_MONITOR_PROVIDER: ${{ vars.POLICY_MONITOR_PROVIDER }}
        run: node monitor/run.mjs
      - name: Publish the latest observation status and evidence
        run: |
          git config user.name 'Policy Monitor'
          git config user.email 'policy-monitor@users.noreply.github.com'
          git add monitor/state.json app/policy-updates.json api/policy-updates.json app/regional-statistics.json app/us-trade-statistics.json app/us-investment-statistics.json
          if [ -f monitor/regional-series-metadata.json ]; then git add monitor/regional-series-metadata.json; fi
          if [ -f monitor/us-investment-discovery.json ]; then git add monitor/us-investment-discovery.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily policy source observations'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report source outage
        if: steps.scan.outcome == 'failure'
        run: echo 'No monitored source could be read. Failure status was saved without advancing the last successful check.'

