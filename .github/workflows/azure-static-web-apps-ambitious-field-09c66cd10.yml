name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ['Daily Policy Monitor']
    types: [completed]
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

concurrency:
  group: azure-policy-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          submodules: true
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate shared evidence and interaction boundaries
        run: |
          node scripts/validate-evidence.mjs
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned official-report page renderer
        run: python3 -m pip install PyMuPDF==1.26.6
      - name: Verify and cache original publisher images and report pages
        run: node scripts/cache-source-visuals.mjs
      - name: Retain source-image provenance for deployment verification
        uses: actions/upload-artifact@v4
        with:
          name: official-source-visuals-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/assets/source-visuals/
          retention-days: 7
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_FIELD_09C66CD10 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./app"
          api_location: "./api"
          output_location: ""
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
